<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style4.css">
</head>

<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-8 col-md-6 col-lg-4">

                <!-- Login Card -->
                <div class="card instagram-card border">

                    <div class="card-body p-4">

                        <!-- Instagram Logo -->
                        <h1 class="instagram-logo text-center mb-4">
                            Instagram
                        </h1>

                        <!-- Username -->
                        <div class="mb-2">
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Phone number, username, or email">
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <input
                                type="password"
                                class="form-control"
                                placeholder="Password">
                        </div>

                        <!-- Login Button -->
                        <div class="d-grid">
                            <button class="btn btn-primary fw-bold">
                                Log In
                            </button>
                        </div>

                        <!-- OR Divider -->
                        <div class="d-flex align-items-center my-4">

                            <hr class="flex-grow-1">

                            <span class="mx-3 text-muted small fw-bold">
                                OR
                            </span>

                            <hr class="flex-grow-1">

                        </div>

                        <!-- Facebook Login -->
                        <div class="text-center">
                            <a href="#" class="facebook-login">
                                Log in with Facebook
                            </a>
                        </div>

                        <!-- Forgot Password -->
                        <div class="text-center mt-3">
                            <a href="#" class="forgot-password">
                                Forgot password?
                            </a>
                        </div>

                    </div>

                </div>

                <!-- Sign Up Card -->
                <div class="card signup-card mt-3 text-center">

                    <div class="card-body">
                        Don't have an account?
                        <a href="#" class="signup-link">
                            Sign up
                        </a>
                    </div>

                </div>

                <!-- Get App -->
                <p class="text-center mt-4">
                    Get the app.
                </p>

                <div class="text-center">
                    <button class="btn btn-dark btn-sm me-2">
                        Google Play
                    </button>

                    <button class="btn btn-dark btn-sm">
                        App Store
                    </button>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
